<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kültürpark Orman – Menü</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12362a;--bg2:#2c6b4a;--card:#fbf6e6;--card2:#f3ead0;--ink:#173d2d;--mut:#7a6a45;--gold:#b08a3e;--line:#c9a45c;--pill:#1f5a40;--pilltx:#fff;--bar:#12362a;--bartx:#f3ead0;--baron:#c9a45c;--baronx:#12362a;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f17;--bg2:#143828;--card:#173d2d;--card2:#12342a;--ink:#f3ead0;--mut:#b9ae8c;--gold:#d9b46a;--line:#8a7140;--pill:#c9a45c;--pilltx:#12362a;--bar:#0b1f17;--in:#0f2a20}}
:root[data-theme="dark"]{--bg:#0b1f17;--bg2:#143828;--card:#173d2d;--card2:#12342a;--ink:#f3ead0;--mut:#b9ae8c;--gold:#d9b46a;--line:#8a7140;--pill:#c9a45c;--pilltx:#12362a;--bar:#0b1f17;--in:#0f2a20}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}body{font-family:Poppins,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 55%);background-attachment:fixed;color:var(--ink);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
header{text-align:center;padding:22px 16px 8px}header img{width:min(260px,70vw);border-radius:50%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar a{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--bartx);text-decoration:none;font-weight:600;font-size:14px}.bar a.on{background:var(--baron);color:var(--baronx);border-color:var(--baron)}
.srch{max-width:640px;margin:14px auto 0;padding:0 14px}.srch input{width:100%;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--in);color:var(--ink);font:500 15px Poppins,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
section{background:linear-gradient(var(--card),var(--card2));border:2px solid var(--line);border-radius:28px;padding:22px 18px 14px;margin-top:18px}
h2{text-align:center;font-weight:800;font-size:24px;line-height:1.15;text-transform:uppercase}h3{text-align:center;font-weight:500;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin:4px 0 12px}
.ph{display:flex;gap:8px;overflow-x:auto;margin:0 -4px 14px;padding:0 4px;scroll-snap-type:x mandatory;scrollbar-width:none}.ph::-webkit-scrollbar{display:none}.ph img{flex:none;width:44%;max-width:180px;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid var(--pill);scroll-snap-align:start}
.r{display:flex;align-items:center;gap:10px;padding:10px 0}.r+.r{border-top:1px dashed var(--line)}.t{flex:1;min-width:0}.t b{display:block;font-weight:600;font-size:16px;line-height:1.25}.t small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.p{flex:none;font-weight:700;font-size:15px;background:var(--pill);color:var(--pilltx);padding:4px 14px;border-radius:999px;white-space:nowrap}
.no{display:none;text-align:center;color:#f3ead0;padding:30px 0}footer{text-align:center;color:#f3ead0;opacity:.8;font-size:13px;letter-spacing:3px;padding:6px 0 30px}
</style></head><body>

return `<section id="${c.id}"><h2>${e(c.tr)}</h2><h3>${e(c.en)}</h3>${f?'':`<div class="ph">${c.photos.map(p=>`<img loading="lazy" alt="" src="data:image/jpeg;base64,${p}">`).join('')}</div>`}${it.map(x=>`<div class="r"><div class="t"><b>${e(x[0])}</b>${x[1]?`<small>${e(x[1])}</small>`:''}</div><span class="p">${e(x[2])} ₺</span></div>`).join('')}</section>`}).join('');
document.getElementById('no').style.display=any?'none':'block'}
draw();q.oninput=()=>draw(q.value.trim());
const io=new IntersectionObserver(es=>{es.forEach(x=>{if(x.isIntersecting)bar.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.i===x.target.id))})},{rootMargin:'-30% 0px -60% 0px'});
const watch=()=>document.querySelectorAll('section').forEach(s=>io.observe(s));watch();
q.addEventListener('input',()=>{io.disconnect();watch()});
</script></body></html>
